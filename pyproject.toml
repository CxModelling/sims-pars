[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sims-pars"
version = "3.0.0"
description = "Serving stochastic parameters to simulation models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Chu-Chang Ku", email = "TimeWz667@gmail.com" },
]
keywords = [
    "simulation",
    "probability theory",
    "Bayesian networks",
    "graph",
    "model fitting",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "networkx>=3.2",
    "joblib>=1.4",
    "tqdm>=4.66",
    "pydantic>=2.7",
]

[project.optional-dependencies]
hme = ["gpytorch>=1.15", "torch>=2.9"]
plot = ["matplotlib>=3.8"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.24",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
sims-pars = "sims_pars.pcore.cli:main"

[project.urls]
Homepage = "https://github.com/CxModelling/sims-pars"
Documentation = "https://cxmodelling.github.io/sims-pars/"
"Bug Tracker" = "https://github.com/CxModelling/sims-pars/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: long-running tests, excluded from the default run",
]

[tool.coverage.run]
source = ["sims_pars"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# The legacy library modules lean on ``import *`` and other loose style; keep the
# repo-wide gate focused on real defects (pyflakes + bugbear) and tighten in tests.
select = ["F", "E9", "B"]
ignore = ["F403", "F405", "E741", "B007", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F403", "F405"]
"**/__init__.py" = ["F401"]
